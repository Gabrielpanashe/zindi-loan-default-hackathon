server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Railway health check
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Docker Compose local only — proxies /api to the api container.
    # On Railway, VITE_API_URL is set so the browser calls the API
    # service directly; this block is never reached.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA — all routes fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
